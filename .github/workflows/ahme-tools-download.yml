name: Publish AHME Tools download

on:
  push:
    branches: [ahme-tools-download]
    paths:
      - downloads/AHME-Tools-Source.zip
      - .github/workflows/ahme-tools-download.yml

permissions:
  contents: write

concurrency:
  group: ahme-tools-public-download
  cancel-in-progress: false

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract application source
        shell: powershell
        run: Expand-Archive downloads/AHME-Tools-Source.zip -DestinationPath build
      - name: Test Windows PowerShell maintenance with isolated cache fixtures
        working-directory: build/ahme-desktop
        shell: powershell
        run: ./tests/maintenance.windows.ps1 | Tee-Object -FilePath windows-native.txt
      - name: Test actual Windows bridge and hash verification
        working-directory: build/ahme-desktop
        shell: powershell
        run: node tests/maintenance.windows.cjs
      - name: Summarize native checks
        if: always()
        shell: pwsh
        run: |
          '### Windows maintenance validation' >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/ahme-desktop/windows-native.txt) { Get-Content build/ahme-desktop/windows-native.txt >> $env:GITHUB_STEP_SUMMARY }
          '```' >> $env:GITHUB_STEP_SUMMARY
  build-and-publish:
    needs: windows-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract application source
        run: unzip -q downloads/AHME-Tools-Source.zip -d build
      - name: Install locked dependencies
        working-directory: build/ahme-desktop
        run: npm ci
      - name: Check command mapping and integrity
        working-directory: build/ahme-desktop
        run: node --test tests/*.test.cjs
      - name: Package Windows application
        working-directory: build/ahme-desktop
        run: npm run package:win
      - name: Create portable ZIP and checksums
        working-directory: build/ahme-desktop
        run: |
          cp README.md dist/AHME-Tools-win32-x64/README-Arabic.md
          mkdir -p dist/AHME-Tools-win32-x64/original
          cp original/ahme.cmd dist/AHME-Tools-win32-x64/original/ahme.cmd
          cd dist
          zip -q -r AHME-Tools-Windows-x64.zip AHME-Tools-win32-x64
          unzip -tq AHME-Tools-Windows-x64.zip
          sha256sum AHME-Tools-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/ahme-release-notes.md <<'NOTES'
          إصدار 2.0: صفحة العناية بالجهاز، قراءات حقيقية للرام والمعالج، تحرير ذاكرة تطبيق محدد وطلب إغلاقه، فحص الكاش قبل الحذف، إيقاف وتشغيل خدمات اختيارية، إعدادات بدء التشغيل والطاقة والتخزين، وأربعة ثيمات مع مؤثرات قابلة للإيقاف. الخيارات الأصلية الـ71 محفوظة.

          حمّل AHME-Tools-Windows-x64.zip، ثم فك الضغط بالكامل على كمبيوتر Windows وشغّل AHME-Tools.exe. يمكنك حفظ ZIP على الموبايل ثم نقله للكمبيوتر. الحزمة محمولة وغير موقّعة، ولا تحتاج تثبيت Node.js.

          نجح محليًا 10 اختبارات Node و13 اختبار متصفح. يتطلب النشر أيضًا نجاح اختبارات التنظيف والذاكرة والربط على Windows بملفات تجريبية. لم يُختبر إيقاف الخدمات فعليًا أو تجربة UAC وواجهة EXE على جهاز شخصي، ولم يُقَس أثر تعديلات السكربت الأصلي أو تحسن السرعة. تحرير ذاكرة التطبيق مؤقت وقد يعيد تحميلها.

          ملفات خطة الطاقة وAutoruns غير موجودة في المرفق الأصلي وليست ضمن الحزمة. زر إعدادات بدء التشغيل الجديد لا يحتاج Autoruns. التفاصيل في README-Arabic.md.
          NOTES
          if gh release view ahme-tools-v1.0.0 >/dev/null 2>&1; then
            gh release upload ahme-tools-v1.0.0 build/ahme-desktop/dist/AHME-Tools-Windows-x64.zip build/ahme-desktop/dist/SHA256SUMS.txt downloads/AHME-Tools-Source.zip downloads/AHME-Tools-preview.png --clobber
            gh release edit ahme-tools-v1.0.0 --title 'AHME Tools 2.0 — Care & Themes' --notes-file /tmp/ahme-release-notes.md
          else
            gh release create ahme-tools-v1.0.0 build/ahme-desktop/dist/AHME-Tools-Windows-x64.zip build/ahme-desktop/dist/SHA256SUMS.txt downloads/AHME-Tools-Source.zip downloads/AHME-Tools-preview.png --target "$GITHUB_SHA" --title 'AHME Tools 2.0 — Care & Themes' --notes-file /tmp/ahme-release-notes.md
          fi
