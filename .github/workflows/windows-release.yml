name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nawa-windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require the intended draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh release view v0.1.0 --json isDraft --jq .isDraft)" = true
      - run: npm ci
      - name: Install Chromium for functional checks
        run: npx playwright install --with-deps chromium
      - name: Run drawing and file export checks
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm test
      - name: Package Windows application
        run: npm run package:win
      - name: Archive and checksum
        working-directory: dist
        run: |
          zip -q -r NawaPaint-Windows-x64.zip NawaPaint-win32-x64
          sha256sum NawaPaint-Windows-x64.zip > SHA256SUMS.txt
          unzip -tq NawaPaint-Windows-x64.zip
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.1.0 --json isDraft --jq .isDraft)" = true
          gh release upload v0.1.0 dist/NawaPaint-Windows-x64.zip dist/SHA256SUMS.txt --clobber
